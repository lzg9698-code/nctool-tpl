<style>
/* ══════════════ 设计令牌（v2）：暗色为默认，亮色为对等主题 ══════════════ */
:root, [data-theme="dark"] {
  --bg:            #0b0f14;
  --bg-panel:      #12171e;
  --bg-panel-2:    #161d26;
  --bg-hover:      #1c2530;
  --bg-active:     #223042;
  --border:        #222c38;
  --border-strong: #2d3a49;
  --text:          #d7dfe8;
  --text-dim:      #9aa8b6;   /* v2：提亮一档，保证 ≥ 4.5:1 */
  --text-faint:    #6b7887;   /* v2：仅用于非必要装饰（≥ 3:1） */
  --accent:        #e8a33d;
  --accent-ink:    #1a1206;
  --accent-2:      #4aa3df;
  --ok:            #3fb68b;
  --warn:          #e0a33d;
  --err:           #e0654f;
  --info:          #4aa3df;
  --ok-bg:         rgba(63,182,139,.12);
  --err-bg:        rgba(224,101,79,.12);
  --warn-bg:       rgba(224,163,61,.12);
  --shadow:        none;
  --ring:          rgba(232,163,61,.45);
  /* G-code 高亮 */
  --gc-line:  #5c6b7a;
  --gc-cmt:   #6b7887;
  --gc-g:     #e8a33d;
  --gc-m:     #4aa3df;
  --gc-tsf:   #9aa8b6;
  --gc-xyz:   #7fb3e0;
  --gc-num:   #9aa8b6;
  --gc-prog:  #3fb68b;
}
[data-theme="light"] {
  --bg:            #f4f5f3;
  --bg-panel:      #ffffff;
  --bg-panel-2:    #fafaf8;
  --bg-hover:      #eceee9;
  --bg-active:     #e6eef7;
  --border:        #e0e2dc;
  --border-strong: #cfd2cb;
  --text:          #25251f;
  --text-dim:      #5f5e5a;
  --text-faint:    #8a8983;
  --accent:        #b26a12;
  --accent-ink:    #ffffff;
  --accent-2:      #185fa5;
  --ok:            #2f7f62;
  --warn:          #8a5a08;
  --err:           #a32d2d;
  --info:          #185fa5;
  --ok-bg:         #e8f4ee;
  --err-bg:        #fcebeb;
  --warn-bg:       #faeeda;
  --shadow:        0 1px 2px rgba(20,20,15,.05), 0 6px 18px rgba(20,20,15,.06);
  --ring:          rgba(178,106,18,.35);
  --gc-line:  #b4b2a9;
  --gc-cmt:   #8a8983;
  --gc-g:     #8a5a08;
  --gc-m:     #185fa5;
  --gc-tsf:   #5f5e5a;
  --gc-xyz:   #185fa5;
  --gc-num:   #5f5e5a;
  --gc-prog:  #0f6e56;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.6; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
h1, h2, h3 { font-weight: 500; margin: 0; letter-spacing: -.2px; }

/* ── 应用外壳 ── */
.app { height: 100vh; display: grid; grid-template-rows: 56px 1fr 28px; overflow: hidden; }
.appbar {
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
}
.brand .logo svg { width: 17px; height: 17px; }
.brand h1 { font-size: 16px; }
.brand .sub { font-size: 12px; color: var(--text-dim); margin: 0; white-space: nowrap; }
.spacer { flex: 1; }
.mode-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--text-dim); white-space: nowrap;
}
.mode-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.mode-badge.demo .dot { background: var(--accent-2); }
.mode-badge.server .dot { background: var(--ok); }

/* ── 按钮 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 12px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--border); background: var(--bg-panel-2); color: var(--text);
  transition: background 120ms ease-out, border-color 120ms ease-out;
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.icon { width: 34px; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.kbd { font-size: 11.5px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }

/* ── 主体：导航 / 参数 / 结果 ── */
.body { display: grid; grid-template-columns: 280px 400px minmax(0, 1fr); min-height: 0; }
.body > * { min-width: 0; }

.nav { display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel); border-right: 1px solid var(--border); }
.nav-head { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.search { position: relative; display: flex; align-items: center; }
.search input {
  width: 100%; height: 36px; padding: 0 32px 0 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-panel-2);
}
.search input::placeholder { color: var(--text-faint); }
.search svg { position: absolute; right: 10px; width: 15px; height: 15px; color: var(--text-faint); pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--text-dim); background: transparent;
  transition: all 120ms ease-out;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.active { background: var(--bg-active); border-color: var(--accent); color: var(--text); }
.chip .n { font-size: 11px; color: var(--text-faint); }
.chip.act { color: var(--accent); border-color: var(--accent); }
/* 陈旧预设：不是禁用态，是"载入前请复核"。角标用 warn 色 + 小字，
   与普通 chip 的视觉重量拉开，但保留可点击（工艺判断在人不在工具）。 */
.chip.act.stale { color: var(--warn); border-color: var(--warn); }
.chip .flag {
  font-style: normal; font-size: 10px; letter-spacing: .2px;
  background: var(--warn-bg); color: var(--warn);
  padding: 1px 5px; border-radius: 4px;
}

.tpl-list { flex: 1; overflow-y: auto; padding: 8px; }
.tpl-sec { font-size: 11.5px; color: var(--text-faint); padding: 10px 8px 6px; }
.tpl-item {
  position: relative; padding: 10px 12px 10px 14px; border-radius: 10px;
  border: 1px solid transparent; margin-bottom: 2px; cursor: pointer;
  transition: background 120ms ease-out;
}
.tpl-item:hover { background: var(--bg-hover); }
.tpl-item.active { background: var(--bg-active); border-color: var(--border-strong); }
.tpl-item.active::before {
  content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.tpl-item .row1 { display: flex; align-items: center; gap: 8px; }
.tpl-item .name { font-size: 14px; font-weight: 500; }
.tpl-item .badge {
  font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-faint);
}
.tpl-item .badge.builtin { color: var(--accent); border-color: var(--accent); }
.tpl-item .desc {
  font-size: 12px; color: var(--text-dim); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tpl-item .meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
.tpl-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

/* ── 参数区 ── */
.params { display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel); border-right: 1px solid var(--border); }
.p-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
.p-title { display: flex; align-items: center; gap: 10px; }
.p-title h2 { font-size: 16px; }
.p-title .crumb { font-size: 12px; color: var(--text-dim); }
.p-title .reset { margin-left: auto; font-size: 12px; color: var(--text-dim); text-decoration: underline; }
.progress { margin-top: 10px; height: 2px; border-radius: 2px; background: var(--border); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width 180ms ease-out; }
.p-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.p-meta .req { color: var(--warn); }
.p-meta .done { color: var(--ok); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.p-body { flex: 1; overflow-y: auto; padding: 6px 16px 24px; }

.form-group { margin-top: 16px; }
.form-group-title { font-size: 12px; font-weight: 500; color: var(--text-faint); margin-bottom: 10px; }
.param-field { margin-bottom: 14px; padding: 2px; border-radius: 8px; }
.param-field.focus { background: var(--warn-bg); }
.param-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.param-top label { font-size: 13.5px; }
.req-tag { font-size: 11px; color: var(--err); }
.opt-tag { font-size: 11px; color: var(--text-faint); }
.range { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }
.param-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
.param-input-wrap { position: relative; display: flex; align-items: center; }
.param-input-wrap input[type=number],
.param-input-wrap input[type=text] {
  width: 100%; height: 40px; padding: 0 54px 0 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-panel-2);
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px;
}
.param-input-wrap select {
  width: 100%; height: 40px; padding: 0 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-panel-2); color: inherit;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px;
}
.param-input-wrap input:hover { border-color: var(--border-strong); }
.param-input-wrap select:hover { border-color: var(--border-strong); }
/* 派生参数提示（这些参数由系统算好注入，不出现在表单里） */
.param-note { margin-top: 10px; font-size: 12px; color: var(--text-faint); line-height: 1.6; }
.param-input-wrap .suffix { position: absolute; right: 11px; font-size: 12px; color: var(--text-faint); pointer-events: none; }
.param-field.err .param-input-wrap input { border-color: var(--err); background: var(--err-bg); }
.field-msg { display: none; margin-top: 5px; font-size: 12px; color: var(--err); }
.field-msg .hint { color: var(--text-faint); font-size: 11.5px; }
.param-field.err .field-msg { display: block; }
.param-field.err .range { display: none; }

.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--border-strong); transition: background 120ms ease-out;
}
.switch .slider::before {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  left: 3px; top: 3px; background: #fff; transition: transform 120ms ease-out;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(18px); }

.optbox { border: 1px solid var(--border); border-radius: 10px; margin-top: 18px; overflow: hidden; }
.optbox > summary {
  display: flex; align-items: center; gap: 8px; padding: 11px 12px;
  font-size: 13px; color: var(--text-dim); cursor: pointer; list-style: none;
}
.optbox > summary::-webkit-details-marker { display: none; }
.optbox > summary:hover { background: var(--bg-hover); }
.optbox > summary .caret { transition: transform 180ms ease-out; }
.optbox[open] > summary .caret { transform: rotate(90deg); }
.optbox .optbox-body { padding: 4px 12px 12px; border-top: 1px solid var(--border); }

.opts { display: flex; flex-direction: column; gap: 2px; }
.opt-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; cursor: pointer; }
.opt-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.opt-item .sub { font-size: 11.5px; color: var(--text-faint); }
.opt-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); padding: 6px 0 6px 24px; }
.opt-inline input { width: 70px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-panel-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font-size: 12.5px; padding: 5px 12px; color: var(--text-dim); }
.seg button.active { background: var(--bg-active); color: var(--text); font-weight: 500; }
.opt-note { font-size: 11.5px; color: var(--text-faint); }

/* ── 结果区 ── */
.result { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
.r-head {
  position: relative; display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 16px; overflow: hidden;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
}
.state {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500;
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--text-dim); white-space: nowrap;
}
.state.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.state.err { color: var(--err); background: var(--err-bg); border-color: transparent; }
.state.err[data-jump] { cursor: pointer; }
.mchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 10px;
  height: 28px; border-radius: 999px; border: 1px solid var(--border); flex: none;
}
.mchip:hover { border-color: var(--accent); }
.mchip svg { width: 13px; height: 13px; color: var(--text-dim); flex: none; }
.mchip select {
  border: none; background: transparent; font-size: 12.5px; color: var(--text);
  max-width: 190px; padding: 0 2px; cursor: pointer;
}
.mchip select:focus { outline: none; }
.mchip .btn.ghost { height: 22px; padding: 0 7px; font-size: 11.5px; border-radius: 999px; }
.r-head .stats { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.r-head .stats .stat.ascii-on { color: var(--err); }
.r-head .prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; }
.r-head .prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.r-head.busy .prog i { width: 100%; animation: slide 900ms ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.tabs { display: flex; gap: 2px; padding: 8px 12px 0; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
.tab {
  font-size: 13px; padding: 7px 12px 9px; color: var(--text-dim);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }

.r-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; position: relative; }
.r-main.with-index { grid-template-columns: 150px minmax(0, 1fr); }
.idx { border-right: 1px solid var(--border); background: var(--bg-panel); overflow-y: auto; padding: 8px 0; }
.idx .h { font-size: 11.5px; color: var(--text-faint); padding: 6px 12px 8px; }
.idx button {
  display: block; width: 100%; text-align: left; font-size: 12px; color: var(--text-dim);
  padding: 6px 12px; border-left: 2px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.idx button:hover { background: var(--bg-hover); color: var(--text); }
.idx button.on { color: var(--accent); border-left-color: var(--accent); }

.preview-body { overflow: auto; min-height: 0; min-width: 0; }
.preview-body.rendering { animation: fade 200ms ease-out; }
@keyframes fade { from { opacity: .55; } to { opacity: 1; } }
.tabpage { display: none; }
.tabpage.active { display: block; }

.gcode-view {
  margin: 0; padding: 10px 0 40px;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55;
}
.gcode-view .cl { display: flex; padding: 0 12px 0 0; scroll-margin-top: 8px; }
.gcode-view .cl:hover { background: var(--bg-hover); }
.gcode-view .cl.hi { background: var(--warn-bg); }
.gcode-view .no { width: 52px; flex: none; text-align: right; padding-right: 12px; color: var(--gc-line); user-select: none; }
.gcode-view .tx { white-space: pre; }
.gcode-view .cmt { color: var(--gc-cmt); }
.gcode-view .ln { color: var(--gc-line); }
.gcode-view .prog { color: var(--gc-prog); }
.gcode-view .g { color: var(--gc-g); }
.gcode-view .m { color: var(--gc-m); }
.gcode-view .tsf { color: var(--gc-tsf); }
.gcode-view .xyz { color: var(--gc-xyz); }
.gcode-view .num { color: var(--gc-num); }

.src-view {
  margin: 0; padding: 14px 16px 40px; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6;
}
.src-view .tg { color: var(--accent); }
.src-view .tgc { color: var(--text-faint); }

.gcode-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; color: var(--text-dim); text-align: center; padding: 30px;
}
.gcode-empty svg { width: 34px; height: 34px; color: var(--text-faint); }
.guide-steps { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.guide-steps .step {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; width: 172px; text-align: left;
}
.guide-steps .step b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 3px; }
.guide-steps .step span { font-size: 12.5px; color: var(--text-dim); }

.v-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: var(--text-dim); }
.v-empty svg { width: 30px; height: 30px; color: var(--ok); }
.vlist { padding: 14px 16px; }
.v-item {
  display: flex; gap: 10px; padding: 11px 13px; border-radius: 10px; margin-bottom: 8px;
  border: 1px solid var(--border); background: var(--bg-panel); font-size: 13px; cursor: pointer;
}
.v-item:hover { border-color: var(--border-strong); }
.v-item .lv { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--text-faint); }
.v-item.error .lv { background: var(--err); }
.v-item.warning .lv { background: var(--warn); }
.v-item.info .lv { background: var(--info); }
.v-item .v-param { font-weight: 500; color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; }
.v-item .v-msg { color: var(--text); }
.v-item .v-loc { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

.r-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg-panel); border-top: 1px solid var(--border); }

/* ── 状态条 ── */
.statusbar {
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
  font-size: 12px; color: var(--text-dim);
  background: var(--bg-panel); border-top: 1px solid var(--border);
}
.statusbar .st { display: inline-flex; align-items: center; gap: 6px; }
.statusbar .st .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar .st.rendering .dot { background: var(--warn); }
.statusbar .st.err { color: var(--err); }
.statusbar .st.err .dot { background: var(--err); }
.statusbar .right { margin-left: auto; display: flex; gap: 16px; }

/* ── 抽屉（沿用 modal-mask 机制，视觉为右侧抽屉） ── */
.modal-mask {
  position: fixed; inset: 0; z-index: 40; display: none;
  background: rgba(8, 10, 14, .45);
}
.modal-mask.open { display: block; }
.modal {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 94vw);
  display: flex; flex-direction: column; background: var(--bg-panel);
  border-left: 1px solid var(--border-strong); box-shadow: var(--shadow);
