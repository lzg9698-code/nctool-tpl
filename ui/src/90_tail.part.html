
<!-- 自定义机床弹窗（脚本末尾动态使用，独立于此便于阅读） -->
<div class="modal-mask" id="modalCustomMachine">
  <div class="modal">
    <div class="modal-head"><h3>自定义机床配置</h3><button class="close" data-close="modalCustomMachine">×</button></div>
    <div class="modal-body">
      <div class="field"><label>MachineConfig JSON（id / vendor / model / config）</label>
        <textarea id="customArea" spellcheck="false" style="min-height:300px"></textarea>
      </div>
      <div class="tip">config 键值均为字符串，模板通过 <code>{{ machine.xxx }}</code> 引用；
        保存后在下拉框选择「自定义」即可生效（localStorage 持久化）。</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="customResetBtn">恢复内置</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-close="modalCustomMachine">取消</button>
      <button class="btn primary" id="customSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* 自定义机床：保存 / 恢复（独立小块，避免与主脚本耦合） */
(function () {
  const $ = id => document.getElementById(id);
  $("customSaveBtn").addEventListener("click", () => {
    try {
      const cfg = JSON.parse($("customArea").value);
      if (!cfg.id || !cfg.config) throw new Error("缺少 id 或 config");
      try { localStorage.setItem("nctool.customMachine", JSON.stringify(cfg)); }
      catch { alert("当前环境不允许本地存储（file:// 或隐私模式），配置未能保存"); return; }
      closeCustom();
      location.reload();
    } catch (e) { alert("JSON 无效：" + e.message); }
  });
  $("customResetBtn").addEventListener("click", () => {
    try { localStorage.removeItem("nctool.customMachine"); } catch { /* 忽略 */ }
    closeCustom();
    location.reload();
  });
  function closeCustom() { document.getElementById("modalCustomMachine").classList.remove("open"); }
})();
</script>
</body>
</html>
