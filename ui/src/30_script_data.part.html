/* ═══════════════════════════════════════════════════════════════
   2. 迷你 Jinja 渲染器（演示模式；严格模式语义近似 minijinja）
   ═══════════════════════════════════════════════════════════════ */
const UNDEF = Symbol("undefined");
const isUndef = v => v === UNDEF || v === undefined;
const truthy = v => !isUndef(v) && !!v;

/* —— 表达式词法 —— */
function tokenizeExpr(src) {
  const toks = []; let i = 0;
  const ws = /\s/;
  const numRe = /^[0-9]*\.?[0-9]+(?:[eE][+-]?[0-9]+)?/;
  while (i < src.length) {
    const c = src[i];
    if (ws.test(c)) { i++; continue; }
    if (c === "'" || c === '"') {
      let j = i + 1, s = "";
      while (j < src.length && src[j] !== c) {
        if (src[j] === "\\" && j + 1 < src.length) { s += src[j + 1]; j += 2; }
        else { s += src[j]; j++; }
      }
      toks.push({ t: "str", v: s }); i = j + 1; continue;
    }
    const rest = src.slice(i);
    const num = numRe.exec(rest);
    if (num && num[0].length > 0 && (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(rest[1] || "")))) {
      toks.push({ t: "num", v: parseFloat(num[0]) }); i += num[0].length; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      toks.push({ t: "id", v: src.slice(i, j) }); i = j; continue;
    }
    const two = src.slice(i, i + 2);
    if (["==", "!=", "<=", ">="].includes(two)) { toks.push({ t: "op", v: two }); i += 2; continue; }
    if ("+-*/%|(),.[]:".includes(c) || c === "<" || c === ">") { toks.push({ t: "op", v: c }); i++; continue; }
    i++;
  }
  toks.push({ t: "eof" });
  return toks;
}

/* —— 表达式解析（递归下降）—— */
class ExprParser {
  constructor(src) { this.toks = tokenizeExpr(src); this.p = 0; }
  peek() { return this.toks[this.p]; }
  next() { return this.toks[this.p++]; }
  expectOp(op) { const t = this.next(); if (t.t === "op" && t.v === op) return; throw new Error(`表达式语法错误：期望 ${op}`); }
  parse() { return this.parseTernary(); }
  parseTernary() {
    const v = this.parseOr();
    const t = this.peek();
    if (t.t === "id" && t.v === "if") {
      this.next();
      const c = this.parseOr();
      const e2 = this.next();
      if (!(e2.t === "id" && e2.v === "else")) throw new Error("三元表达式缺少 else");
      const e = this.parseTernary();
      return { k: "tern", v, c, e };
    }
    return v;
  }
  parseOr() {
    let l = this.parseAnd();
    while (this.peek().t === "id" && this.peek().v === "or") { this.next(); const r = this.parseAnd(); l = { k: "bin", op: "or", l, r }; }
    return l;
  }
  parseAnd() {
    let l = this.parseNot();
    while (this.peek().t === "id" && this.peek().v === "and") { this.next(); const r = this.parseNot(); l = { k: "bin", op: "and", l, r }; }
    return l;
  }
  parseNot() {
    if (this.peek().t === "id" && this.peek().v === "not") { this.next(); return { k: "un", op: "not", e: this.parseNot() }; }
    return this.parseCmp();
  }
  parseCmp() {
    let l = this.parseAdd();
    for (;;) {
      const t = this.peek();
      if (t.t === "op" && ["==", "!=", "<", ">", "<=", ">="].includes(t.v)) {
        this.next(); const r = this.parseAdd(); l = { k: "bin", op: t.v, l, r };
      } else if (t.t === "id" && t.v === "is") {
        this.next();
        let neg = false;
        if (this.peek().t === "id" && this.peek().v === "not") { neg = true; this.next(); }
        const tn = this.next();
        if (!(tn.t === "id" && (tn.v === "defined" || tn.v === "undefined"))) throw new Error("is 测试仅支持 defined/undefined");
        l = { k: "test", e: l, name: tn.v, not: neg };
      } else break;
    }
    return l;
  }
  parseAdd() {
    let l = this.parseMul();
    for (;;) { const t = this.peek(); if (t.t === "op" && (t.v === "+" || t.v === "-")) { this.next(); const r = this.parseMul(); l = { k: "bin", op: t.v, l, r }; } else break; }
    return l;
  }
  parseMul() {
    let l = this.parseUnary();
    for (;;) { const t = this.peek(); if (t.t === "op" && (t.v === "*" || t.v === "/" || t.v === "%")) { this.next(); const r = this.parseUnary(); l = { k: "bin", op: t.v, l, r }; } else break; }
    return l;
  }
  parseUnary() {
    const t = this.peek();
    if (t.t === "op" && t.v === "-") { this.next(); return { k: "un", op: "-", e: this.parseUnary() }; }
    return this.parsePostfix();
  }
  parsePostfix() {
    let e = this.parsePrimary();
    for (;;) {
      const t = this.peek();
      if (t.t === "op" && t.v === ".") {
        this.next(); const name = this.next();
        if (name.t !== "id") throw new Error("属性名应为标识符");
        e = { k: "attr", obj: e, name: name.v };
      } else break;
    }
    while (this.peek().t === "op" && this.peek().v === "|") {
      this.next(); const name = this.next();
      if (name.t !== "id") throw new Error("过滤器名应为标识符");
      let args = [];
      if (this.peek().t === "op" && this.peek().v === "(") {
        this.next();
        if (!(this.peek().t === "op" && this.peek().v === ")")) {
          args.push(this.parseExpr());
          while (this.peek().t === "op" && this.peek().v === ",") { this.next(); args.push(this.parseExpr()); }
        }
        this.expectOp(")");
      }
      e = { k: "filter", e, name: name.v, args };
    }
    return e;
  }
  parsePrimary() {
    const t = this.next();
    if (t.t === "num") return { k: "num", v: t.v };
    if (t.t === "str") return { k: "str", v: t.v };
    if (t.t === "id") {
      if (t.v === "true") return { k: "bool", v: true };
      if (t.v === "false") return { k: "bool", v: false };
      if (t.v === "none" || t.v === "null") return { k: "none" };
      if (this.peek().t === "op" && this.peek().v === "(") {
        this.next(); const args = [];
        if (!(this.peek().t === "op" && this.peek().v === ")")) {
          args.push(this.parseExpr());
          while (this.peek().t === "op" && this.peek().v === ",") { this.next(); args.push(this.parseExpr()); }
        }
        this.expectOp(")");
        return { k: "call", name: t.v, args };
      }
      return { k: "ident", v: t.v };
    }
    if (t.t === "op" && t.v === "(") { const e = this.parseExpr(); this.expectOp(")"); return e; }
    if (t.t === "op" && t.v === "[") {
      const items = [];
      if (!(this.peek().t === "op" && this.peek().v === "]")) {
        items.push(this.parseExpr());
        while (this.peek().t === "op" && this.peek().v === ",") { this.next(); items.push(this.parseExpr()); }
      }
      this.expectOp("]");
      return { k: "list", items };
    }
    throw new Error(`无法解析表达式: ${t.v || t.t}`);
  }
  parseExpr() { return this.parseTernary(); }
}

/* —— 过滤器 —— */
function applyFilter(name, val, args) {
  if (isUndef(val) && name !== "default" && name !== "d") return UNDEF;
  const num = () => { const n = Number(val); if (!isFinite(n)) throw new Error(`过滤器 ${name}: 非有限数`); return n; };
  switch (name) {
    case "nc_fixed": { const n = num(), w = Number(args[0] ?? 3); return n.toFixed(w); }
    case "nc_strip": { let s = num().toFixed(10).replace(/\.?0+$/, ""); if (s === "" || s === "-") s = "0"; return s; }
    case "nc_pad": { const n = num(), w = Number(args[0] ?? 4); if (!Number.isInteger(n)) throw new Error("nc_pad: 需要整数值"); return String(Math.trunc(n)).padStart(w, "0"); }
    case "default": case "d": return isUndef(val) ? args[0] : val;
    case "int": return Math.trunc(num());
    case "float": return num();
    case "round": { const f = Math.pow(10, Number(args[0] ?? 0)); return Math.round(num() * f) / f; }
    case "abs": return Math.abs(num());
    case "lower": return String(val).toLowerCase();
    case "upper": return String(val).toUpperCase();
    case "trim": return String(val).trim();
    case "length": return String(val).length;
    case "sqrt": return Math.sqrt(num());
    case "sin": return Math.sin(num());
    case "cos": return Math.cos(num());
    case "tan": return Math.tan(num());
    case "floor": return Math.floor(num());
    case "ceil": return Math.ceil(num());
    case "pow": return Math.pow(num(), Number(args[0] ?? 1));
    default: throw new Error(`未知过滤器: ${name}`);
  }
}
function callFn(name, args) {
  if (name === "range") { const n = Math.trunc(Number(args[0] ?? 0)); const a = []; for (let i = 0; i < n; i++) a.push(i); return a; }
  throw new Error(`未知函数: ${name}`);
}

/* —— 表达式求值 —— */
function evExpr(node, env) {
  switch (node.k) {
    case "num": case "str": case "bool": case "none": return node.v;
    case "ident": {
      if (node.v === "loop") return env.loop ?? UNDEF;
      for (let i = env.scopes.length - 1; i >= 0; i--) if (node.v in env.scopes[i]) return env.scopes[i][node.v];
      return UNDEF;
    }
    case "attr": {
      const o = evExpr(node.obj, env);
      if (isUndef(o) || o === null) return UNDEF;
      if (typeof o === "object") return o[node.name] ?? UNDEF;
      return UNDEF;
    }
    case "call": return callFn(node.name, node.args.map(a => evExpr(a, env)));
    case "list": return node.items.map(i => evExpr(i, env));
    case "un": {
      if (node.op === "not") return !truthy(evExpr(node.e, env));
      if (node.op === "-") { const v = evExpr(node.e, env); if (isUndef(v)) return UNDEF; if (typeof v !== "number") throw new Error("一元负号需要数值"); return -v; }
      return UNDEF;
    }
    case "bin": {
      if (node.op === "and") { const l = evExpr(node.l, env); return truthy(l) ? evExpr(node.r, env) : l; }
      if (node.op === "or") { const l = evExpr(node.l, env); return truthy(l) ? l : evExpr(node.r, env); }
      const l = evExpr(node.l, env), r = evExpr(node.r, env);
      if (isUndef(l) || isUndef(r)) return UNDEF;
      switch (node.op) {
        case "+": if (typeof l === "number" && typeof r === "number") return l + r; return String(l) + String(r);
        case "-": return l - r; case "*": return l * r; case "/": return l / r; case "%": return l % r;
        case "==": return l === r; case "!=": return l !== r;
        case "<": return l < r; case ">": return l > r; case "<=": return l <= r; case ">=": return l >= r;
      }
      return UNDEF;
    }
    case "test": {
      const v = evExpr(node.e, env);
      let res = node.name === "defined" ? !isUndef(v) : isUndef(v);
      if (node.not) res = !res;
      return res;
    }
    case "tern": { const c = evExpr(node.c, env); return truthy(c) ? evExpr(node.v, env) : evExpr(node.e, env); }
    case "filter": {
      const val = evExpr(node.e, env);
      return applyFilter(node.name, val, node.args.map(a => evExpr(a, env)));
    }
  }
  return UNDEF;
}

/* —— 模板分词 → 块树 —— */
function tokenizeTemplate(src) {
  const segs = []; let i = 0, text = "";
  const pushText = () => { if (text !== "") { segs.push({ k: "text", v: text }); text = ""; } };
  while (i < src.length) {
    const openVar = src.indexOf("{{", i);
    const openBlk = src.indexOf("{%", i);
    const openCmt = src.indexOf("{#", i);
    let next = Infinity, type = null;
    if (openVar !== -1 && openVar < next) { next = openVar; type = "var"; }
    if (openBlk !== -1 && openBlk < next) { next = openBlk; type = "blk"; }
    if (openCmt !== -1 && openCmt < next) { next = openCmt; type = "cmt"; }
    if (type === null) { text += src.slice(i); break; }
    text += src.slice(i, next); i = next;
    if (type === "var") {
      const end = src.indexOf("}}", i + 2);
      if (end === -1) { text += src.slice(i); break; }
      pushText();
      let expr = src.slice(i + 2, end), trimL = false, trimR = false;
      if (expr.startsWith("-")) { trimL = true; expr = expr.slice(1); }
      if (expr.endsWith("-")) { trimR = true; expr = expr.slice(0, -1); }
      segs.push({ k: "var", expr: expr.trim(), trimL, trimR });
      i = end + 2;
    } else if (type === "blk") {
      const end = src.indexOf("%}", i + 2);
      if (end === -1) { text += src.slice(i); break; }
      pushText();
      let inner = src.slice(i + 2, end), trimL = false, trimR = false;
      if (inner.startsWith("-")) { trimL = true; inner = inner.slice(1); }
      if (inner.endsWith("-")) { trimR = true; inner = inner.slice(0, -1); }
      const body = inner.trim();
      const mSet = /^set\s+([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/.exec(body);
      const mFor = /^for\s+([A-Za-z_][A-Za-z0-9_]*)\s+in\s+(.*)$/.exec(body);
      const mInc = /^include\s+["'](.*?)["']$/.exec(body);
      if (/^set\s/.test(body) && mSet) segs.push({ k: "set", name: mSet[1], expr: mSet[2].trim(), trimL, trimR });
      else if (/^include\s/.test(body) && mInc) segs.push({ k: "include", name: mInc[1], trimL, trimR });
      else if (/^if\s/.test(body)) segs.push({ k: "branch", tag: "if", expr: body.slice(2).trim(), trimL, trimR });
      else if (/^elif\s/.test(body)) segs.push({ k: "branch", tag: "elif", expr: body.slice(4).trim(), trimL, trimR });
      else if (body === "else") segs.push({ k: "branch", tag: "else", expr: "", trimL, trimR });
      else if (body === "endif") segs.push({ k: "end", tag: "endif", trimL, trimR });
      else if (/^for\s/.test(body) && mFor) segs.push({ k: "for", name: mFor[1], expr: mFor[2].trim(), trimL, trimR });
      else if (body === "endfor") segs.push({ k: "end", tag: "endfor", trimL, trimR });
      else throw new Error(`不支持的控制块: {% ${body} %}`);
      i = end + 2;
    } else {
      const end = src.indexOf("#}", i + 2);
      if (end === -1) { text += src.slice(i); break; }
      pushText(); i = end + 2;
    }
  }
  pushText();
  /* 空白控制 */
  for (let idx = 0; idx < segs.length; idx++) {
    const s = segs[idx];
    if (s.trimL && segs[idx + 1] && segs[idx + 1].k === "text") segs[idx + 1].v = segs[idx + 1].v.replace(/^\s+/, "");
    if (s.trimR && segs[idx - 1] && segs[idx - 1].k === "text") segs[idx - 1].v = segs[idx - 1].v.replace(/\s+$/, "");
  }
  /* 构建嵌套块树 */
  const root = [], stack = [root];
  for (const s of segs) {
    if (s.k === "branch") {
      if (s.tag === "if" || s.tag === "elif") {
        const cur = stack[stack.length - 1];
        const node = { k: "if", branches: [{ cond: s.expr, body: [] }], elseBody: null };
        cur.push(node); stack.push(node.branches[0].body);
      } else if (s.tag === "elif") {
        stack.pop();
        const cur = stack[stack.length - 1], ifNode = cur[cur.length - 1];
        ifNode.branches.push({ cond: s.expr, body: [] }); stack.push(ifNode.branches[ifNode.branches.length - 1].body);
      } else { /* else */
        stack.pop();
        const cur = stack[stack.length - 1], ifNode = cur[cur.length - 1];
        ifNode.elseBody = []; stack.push(ifNode.elseBody);
      }
    } else if (s.k === "end") {
      stack.pop();
    } else if (s.k === "for") {
      const cur = stack[stack.length - 1];
      const node = { k: "for", name: s.name, expr: s.expr, body: [] };
      cur.push(node); stack.push(node.body);
    } else {
      stack[stack.length - 1].push(s);
    }
  }
  return root;
}

function formatValue(v) {
  if (v === true) return "True";
  if (v === false) return "False";
  if (v === null || isUndef(v)) return "";
  return String(v);
}

function renderBody(nodes, env, emit) {
  for (const s of nodes) {
    if (s.k === "text") { emit(s.v); }
    else if (s.k === "var") {
      const v = evExpr(new ExprParser(s.expr).parse(), env);
      if (!isUndef(v)) emit(formatValue(v));
    } else if (s.k === "set") {
      const v = evExpr(new ExprParser(s.expr).parse(), env);
      env.scopes[env.scopes.length - 1][s.name] = v;
    } else if (s.k === "include") {
      const t = env.registry[s.name];
      if (!t) throw new Error(`模板不存在: ${s.name}`);
      renderBody(tokenizeTemplate(t.source), env, emit);
    } else if (s.k === "if") {
      let taken = false;
      for (const b of s.branches) {
        const v = evExpr(new ExprParser(b.cond).parse(), env);
        if (truthy(v)) { renderBody(b.body, env, emit); taken = true; break; }
      }
      if (!taken && s.elseBody) renderBody(s.elseBody, env, emit);
    } else if (s.k === "for") {
      const arr = evExpr(new ExprParser(s.expr).parse(), env);
      if (Array.isArray(arr)) {
        let idx0 = 0;
        for (const item of arr) {
          env.scopes.push({ [s.name]: item, loop: { index: idx0 + 1, index0: idx0, length: arr.length } });
          renderBody(s.body, env, emit);
          env.scopes.pop();
          idx0++;
        }
      }
    }
  }
}

/* 渲染入口：返回 { text, error? } */
function renderTemplateSource(tplName, source, params, machine, registry) {
  const tpl = registry[tplName];
  if (!tpl && source === undefined) return { error: `模板不存在: ${tplName}` };
  try {
    const src = source !== undefined ? source : tpl.source;
    const env = { scopes: [{ ...params, machine }], loop: UNDEF, registry };
    let out = "";
    renderBody(tokenizeTemplate(src), env, c => { out += c; });
    return { text: out };
  } catch (e) {
    return { error: e.message || String(e) };
  }
}

/* ═══════════════════════════════════════════════════════════════
   3. 校验 + 后处理（客户端镜像 nctool-core 管线口径）
   ═══════════════════════════════════════════════════════════════ */
function validateTemplate(tpl, params) {
  const issues = [];
  for (const spec of tpl.params) {
    const val = params[spec.name];
    const has = val !== undefined && val !== "";
    if (!has) {
      const required = spec.required && spec.default === undefined;
      if (required) issues.push({ level: "error", kind: "missing", param: spec.name, msg: `必选参数缺失：${spec.name}${spec.unit ? `（${spec.unit}）` : ""}` });
      continue;
    }
    if (spec.kind === "Number" || spec.kind === "Integer") {
      const n = Number(val);
      if (val === "" || !isFinite(n)) issues.push({ level: "error", kind: "nonfinite", param: spec.name, msg: `参数 ${spec.name} 非有限数` });
      else {
        if (spec.kind === "Integer" && !Number.isInteger(n)) issues.push({ level: "error", kind: "type", param: spec.name, msg: `参数 ${spec.name} 需要整数` });
        if (spec.min !== undefined && n < spec.min) issues.push({ level: "error", kind: "range", param: spec.name, msg: `${spec.name} 需 ≥ ${spec.min}${spec.unit || ""}` });
        if (spec.max !== undefined && n > spec.max) issues.push({ level: "error", kind: "range", param: spec.name, msg: `${spec.name} 需 ≤ ${spec.max}${spec.unit || ""}` });
      }
    } else if (spec.kind === "Bool" && typeof val !== "boolean") {
      issues.push({ level: "error", kind: "type", param: spec.name, msg: `${spec.name} 需要布尔值` });
    }
  }
  return issues;
}

function postprocess(rendered, templateName, opts, machine) {
  let out = "";
  if (opts.addHeader) {
    let h = `( ================================== )\n( nctool generated G-code )\n( template: ${templateName} )\n( ================================== )\n`;
    if (opts.ascii) h = h.replace(/[^\x00-\x7F]/g, "?");
    out += h;
  }
  if (opts.format === "text") { out += rendered; return out; }
  const linePrefix = machine.config.line_number_prefix || "N";
  let lineDigits = parseInt(machine.config.line_number_digits || "4", 10) || 4;
  lineDigits = Math.max(1, Math.min(32, lineDigits));
  const progPrefix = machine.config.program_prefix || "O";
  const step = Math.max(1, opts.lineStep || 10);
  let lineNo = 0;
  /* 与 Rust 管线 `rendered.lines()` 语义一致：结尾换行不产生额外空行 */
  const lines = rendered.endsWith("\n") ? rendered.slice(0, -1).split("\n") : rendered.split("\n");
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === "") {
      if (opts.stripBlank) continue;
      out += "\n"; continue;
    }
    let content = trimmed;
    if (opts.ascii) content = content.replace(/[^\x00-\x7F]/g, "?");
    if (opts.lineNumbers) {
      const isProg = trimmed.startsWith(progPrefix) || (progPrefix === "O" && trimmed.startsWith("o"));
      const hasN = trimmed.startsWith(linePrefix) || (linePrefix === "N" && trimmed.startsWith("n"));
      if (!isProg && !hasN) {
        const next = lineNo + step;
        if (next <= (opts.maxLine || 9999)) { lineNo = next; out += `${linePrefix}${String(lineNo).padStart(lineDigits, "0")} `; }
      }
    }
    out += content + "\n";
  }
  return out;
}
