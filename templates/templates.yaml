  "machines/index_g420/uz_dj_x.j2":
    name: "键槽倒角子程序"
    output_filename: "UZ_DJ_X"
    output_extension: ".SPF"
    machine: index_g420
    status: unreviewed
    # 参数约束（清单覆盖层：补头部 `{# PARAMS: #}` 表达不了的字段）。
    # 这两个参数是真正的「有限集合」，且填错会产出**跑得通但几何错误**的 G-code：
    #   - U_FX 的分支链是 `if 左开口 / elif 右开口 / else`，拼错的值会落进 else，
    #     后续 `{% if U_FX == "闭口" %}` 又为假 → 静默走错几何分支；
    #   - U_Q 参与 `{% if U_Q == 0 %}` 的圆弧/直线分支，若以字符串 "0" 传入，
    #     比较为假 → 同样静默走错分支（故声明为 number 而非 any）。
    # 候选值取自源项目 configs/variable_repo.json（U_FX/U_Q 的 options）。
    params:
      - name: U_FX
        kind: choice
        options: ["闭口", "左开口", "右开口"]
      - name: U_Q
        kind: number
        options: [0, 8, 10, 12.5]

