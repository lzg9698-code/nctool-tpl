[package]
name = "nctool-runtime"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
nctool-plugin-sdk={path="../sdk",version="2.0.0"}
nctool-assets={path="../assets",version="2.0.0"}
serde={version="1",features=["derive"]}
serde_json="1"
semver="1"
jsonschema={version="0.33",default-features=false}

[dev-dependencies]
nctool-plugin-template={path="../plugins/template",version="2.0.0"}
nctool-plugin-process={path="../plugins/process",version="2.0.0"}
