name: Release

on:
  push:
    tags:
      - "nctool-tpl-v*"
      - "nctool-core-v*"
      - "nctool-cli-v*"

env:
  CARGO_TERM_COLOR: always
  # 未配置 secret 时为空字符串，publish 步骤按此跳过而非报错
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish ${{ startsWith(github.ref_name, 'nctool-tpl-') && 'nctool-tpl' || (startsWith(github.ref_name, 'nctool-core-') && 'nctool-core') || 'nctool-cli' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify (test)
        run: cargo test --workspace

      - name: Publish nctool-tpl
        if: startsWith(github.ref_name, 'nctool-tpl-') && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p nctool-tpl

      - name: Skip publish (tpl, token missing)
        if: startsWith(github.ref_name, 'nctool-tpl-') && env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN 未配置，跳过发布。请配置仓库 Secret 后手动 publish，或重新推送 tag。"

      - name: Publish nctool-core
        if: startsWith(github.ref_name, 'nctool-core-') && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p nctool-core

      - name: Skip publish (core, token missing)
        if: startsWith(github.ref_name, 'nctool-core-') && env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN 未配置，跳过发布。请配置仓库 Secret 后手动 publish，或重新推送 tag。"

      - name: Publish nctool-cli
        if: startsWith(github.ref_name, 'nctool-cli-') && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p nctool-cli

      - name: Skip publish (cli, token missing)
        if: startsWith(github.ref_name, 'nctool-cli-') && env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN 未配置，跳过发布。请配置仓库 Secret 后手动 publish，或重新推送 tag。"
