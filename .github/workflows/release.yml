name: NCtool 2.0 release
on:
  push:
    tags: ['v2.*']
permissions:
  contents: write
jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  binaries:
    needs: validation
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nctool-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/nctool
          - os: windows-latest
            artifact: nctool-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/nctool.exe
          - os: macos-latest
            artifact: nctool-macos-arm64
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/nctool
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: node scripts/build_ui.mjs
      - run: cargo build --release -p nctool-cli --features nc-bundle --target ${{ matrix.target }} --locked
      - shell: bash
        run: cp '${{ matrix.binary }}' '${{ matrix.artifact }}'
      - name: Record binary checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          binary = Path('${{ matrix.artifact }}')
          checksum = hashlib.sha256(binary.read_bytes()).hexdigest()
          Path(str(binary) + '.sha256').write_text(checksum + '  ' + binary.name + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
