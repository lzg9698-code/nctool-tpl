name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Test / Lint / Doc / Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows 覆盖路径分隔符/配置目录等平台特有行为（开发环境即 Windows）；
      # macOS 按 ROADMAP B4.1 补充，覆盖 XDG_CONFIG_HOME 配置路径与 Unix 行尾
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc check (zero warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    # 覆盖率为可选质量门（ROADMAP B4.1），非阻断项：
    # 该 job 自引入起在 ubuntu runner 上持续失败（quality 三平台矩阵始终
    # 全绿，本地 Windows 复现同一命令成功）。日志需 admin 权限下载，
    # 根因（疑似 install-action 装的 cargo-llvm-cov 与 runner 环境不兼容）
    # 待拿到日志后修复，见 ROADMAP Backlog。先解除 CI 红灯。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview 是 cargo-llvm-cov 生成插桩覆盖率数据的必需组件，
          # 缺失时 llvm-cov 直接失败（taiki-e/install-action 只装 cargo-llvm-cov
          # 二进制本身，不含该组件）
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
