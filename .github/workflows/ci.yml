name: NCtool CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python scripts/audit_dependencies.py
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            target/dependency-audit/*.json
            target/dependency-audit/*.stderr.txt
          if-no-files-found: warn
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix ui
      - run: npm run --prefix ui lint
      - run: npm run --prefix ui test
      - run: node scripts/build_ui.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked
      - run: python scripts/check_v2.py
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: cargo build -p nctool-cli --no-default-features --locked
      - name: Browser acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -p nctool-cli --features math --locked
          npm install --prefix "$RUNNER_TEMP/nctool-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/nctool-browser/node_modules/.bin/playwright" install --with-deps chromium
          NCTOOL_PLAYWRIGHT="$RUNNER_TEMP/nctool-browser/node_modules/playwright" node scripts/browser_acceptance.cjs
          python scripts/check_plugin.py --binary target/debug/nctool --source examples/plugins/protocol-probe --plan examples/plugins/protocol-probe/acceptance.json --python "$(command -v python)" --output target/plugin-acceptance.json
      - name: Upload browser acceptance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            target/ui-rewrite-20261023/
            target/plugin-acceptance.json
          if-no-files-found: warn
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89.0'
      - run: cargo check --workspace --all-features --locked
