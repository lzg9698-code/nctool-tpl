name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Test / Lint / Doc / Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows 覆盖路径分隔符/配置目录等平台特有行为（开发环境即 Windows）；
      # macOS 按 ROADMAP B4.1 补充，覆盖 XDG_CONFIG_HOME 配置路径与 Unix 行尾
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc check (zero warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview 是 cargo-llvm-cov 生成插桩覆盖率数据的必需组件，
          # 缺失时 llvm-cov 直接失败
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 用 `cargo install` 而非第三方 install-action：
      # 原实现走 taiki-e/install-action，其装的 cargo-llvm-cov 与 runner 环境
      # 不兼容，该 job 自引入起持续失败；失败又被 `continue-on-error: true`
      # 掩盖成"非阻断项"，结果是**覆盖率从未被真正度量**——CI 全绿并不代表
      # 覆盖达标。改为官方安装路径，并去掉 continue-on-error 让它成为真门禁。
      # 不带 `--locked`：该标志要求 crate 自带的 Cargo.lock 与**当前** crates.io
      # 索引状态完全一致，上游任何 yank / 新版本发布都会让解析失败。本 job 作为真
      # 门禁首次运行时正是此处以 exit code 101 失败（13s，解析阶段尚未编译），
      # 而本地同时期同命令能正常解析 v0.9.1 —— 说明是索引状态漂移，不是 lock 损坏。
      # 改为锁定工具版本：只固定 cargo-llvm-cov 自身，传递依赖交给 cargo 解析，
      # 兼顾可复现性与稳定性。
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      # 把覆盖率数字打进 job summary：没有数字的门禁等于没有门禁，
      # 后续要设阈值也需要先有一段真实数据基线。
      # `--workspace` 不可省：漏掉它只会统计根 crate（nctool-tpl），
      # 而 core / cli 才是代码主体——摘要会"看起来有数字"却漏掉大部分代码。
      - name: Coverage summary
        run: |
          cargo llvm-cov report --workspace --summary-only | tee coverage-summary.txt
          {
            echo '## 覆盖率'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: |
            lcov.info
            coverage-summary.txt
