name: CI
# 注意：`name:` 的值里不要出现「冒号 + 空格」（如 `(gate: lines >= 89%)`）——
# YAML 会把它当键值分隔符，**整个工作流直接加载失败**，且失败形态很迷惑：
# run 的名字退化成文件路径 `.github/workflows/ci.yml`、jobs API 返回 total_count=null、
# 页面上看不到任何步骤。改完本文件请先做一次 YAML 解析校验再推。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Test / Lint / Doc / Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows 覆盖路径分隔符/配置目录等平台特有行为（开发环境即 Windows）；
      # macOS 按 ROADMAP B4.1 补充，覆盖 XDG_CONFIG_HOME 配置路径与 Unix 行尾
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--param` 取值归一的规则有两份实现：后端 args.rs 与前端 ui/index.html
      # （cli/ui/index.html 是副本）。两者漂移会让 CLI 与 Web UI 对同一输入产出
      # 不同的 G-code —— 静默错误，必须拦。做法是用同一份 fixture
      # （scripts/param_parity_cases.json）对拍：Rust 侧由下面的 cargo test 消费，
      # 前端由本步骤消费。放在最前面是为了让 JS 漂移在几十秒内红，不必等完整构建。
      # 只在 Linux 跑：脚本与系统无关，而 Rust 侧由三个系统的 cargo test 各覆盖一次。
      - name: Setup Node
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Param parity (Rust <-> UI)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check_param_parity.mjs

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # `--workspace` 一个字都不能省：根目录同时是 workspace 根和一个 package，
      # 而 cargo 在没有 default-members 时**默认只选根 package** —— 不加它，
      # 下面三条命令就只对 nctool-tpl 生效，core / cli（代码主体、绝大多数测试）
      # 从未被 CI 真正检查过，却一直显示全绿。这与覆盖率命令踩的是同一个坑。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc check (zero warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview 是 cargo-llvm-cov 生成插桩覆盖率数据的必需组件，
          # 缺失时 llvm-cov 直接失败
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 覆盖率门禁此前从未真正生效，有两层掩盖：
      # 1) `continue-on-error: true` 把持续失败粉饰成非阻断项，CI 全绿并不代表
      #    覆盖达标 —— 已移除，让它成为真门禁；
      # 2) 安装方式：`cargo install` 要在 runner 上从源码编译整套依赖，连续两次
      #    都以 exit 101 卡在本步骤 —— `--locked` 撞上 crates.io 索引漂移；
      #    改固定版本后耗时 <1s 即失败，说明压根没进入构建。
      # 改用官方 install-action 下载预编译二进制：绕开整条 cargo 构建链，
      # 不受索引状态影响，也没有数分钟的编译开销。
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # 单独校验一步：把「没装上」与「装上了但跑不起来」区分开。
      - name: Verify cargo-llvm-cov
        run: cargo llvm-cov --version

      # 阈值门与生成放在同一步：`cargo llvm-cov report` **不接受** `--all-features`
      # （它只读已有数据），拆成两步会引入"读回的数据与生成时不一致"的风险。
      #
      # 90% 是**有意留出余量的地板**：当前基线 91.30% 行覆盖
      # （2026-09-17 补测 cli/src/output.rs 后实测，516 项测试）。
      # 卡在当前值会让"新增少量未覆盖代码"也红，门禁随即被绕过；
      # 1.3pt 余量约等于 120 行新代码，真掉这么多就是覆盖在退化，该拦。
      # 覆盖率提升后请上调此值（只改这一个数字）。
      - name: Generate coverage report (line gate 90%)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 90

      # 把覆盖率数字打进 job summary：没有数字的门禁等于没有门禁。
      # `--workspace` 不可省：漏掉它只会统计根 crate（nctool-tpl），
      # 而 core / cli 才是代码主体——摘要会"看起来有数字"却漏掉大部分代码。
      #
      # `if: always()`：阈值门失败时摘要与产物**仍要产出**——
      # 排查"覆盖为什么掉下去"恰恰需要这两样东西。
      - name: Coverage summary
        if: always()
        run: |
          cargo llvm-cov report --workspace --summary-only | tee coverage-summary.txt
          {
            echo '## 覆盖率'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: |
            lcov.info
            coverage-summary.txt
