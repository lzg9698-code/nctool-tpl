name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Test / Lint / Doc / Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows 覆盖路径分隔符/配置目录等平台特有行为（开发环境即 Windows）；
      # macOS 按 ROADMAP B4.1 补充，覆盖 XDG_CONFIG_HOME 配置路径与 Unix 行尾
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc check (zero warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview 是 cargo-llvm-cov 生成插桩覆盖率数据的必需组件，
          # 缺失时 llvm-cov 直接失败
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 覆盖率门禁此前从未真正生效，有两层掩盖：
      # 1) `continue-on-error: true` 把持续失败粉饰成非阻断项，CI 全绿并不代表
      #    覆盖达标 —— 已移除，让它成为真门禁；
      # 2) 安装方式：`cargo install` 要在 runner 上从源码编译整套依赖，连续两次
      #    都以 exit 101 卡在本步骤 —— `--locked` 撞上 crates.io 索引漂移；
      #    改固定版本后耗时 <1s 即失败，说明压根没进入构建。
      # 改用官方 install-action 下载预编译二进制：绕开整条 cargo 构建链，
      # 不受索引状态影响，也没有数分钟的编译开销。
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # 单独校验一步：把「没装上」与「装上了但跑不起来」区分开。
      - name: Verify cargo-llvm-cov
        run: cargo llvm-cov --version

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      # 把覆盖率数字打进 job summary：没有数字的门禁等于没有门禁，
      # 后续要设阈值也需要先有一段真实数据基线。
      # `--workspace` 不可省：漏掉它只会统计根 crate（nctool-tpl），
      # 而 core / cli 才是代码主体——摘要会"看起来有数字"却漏掉大部分代码。
      - name: Coverage summary
        run: |
          cargo llvm-cov report --workspace --summary-only | tee coverage-summary.txt
          {
            echo '## 覆盖率'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: |
            lcov.info
            coverage-summary.txt
