name: NCtool 2.0 CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix ui
      - run: npm run --prefix ui test
      - run: node scripts/build_ui.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked
      - run: python scripts/check_v2.py
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: cargo build -p nctool-cli --no-default-features --locked
      - name: Browser acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -p nctool-cli --features nc-bundle --locked
          npm install --prefix "$RUNNER_TEMP/nctool-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/nctool-browser/node_modules/.bin/playwright" install --with-deps chromium
          NCTOOL_PLAYWRIGHT="$RUNNER_TEMP/nctool-browser/node_modules/playwright" node scripts/browser_v2.cjs
          NCTOOL_PLAYWRIGHT="$RUNNER_TEMP/nctool-browser/node_modules/playwright" node scripts/browser_review_fixes.cjs
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89.0'
      - run: cargo check --workspace --all-features --locked
