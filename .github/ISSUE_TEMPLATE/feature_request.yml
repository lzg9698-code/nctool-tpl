name: 功能提案
description: 提案新功能 / 改进（CLI / Web UI / 模板与参数系统 / 插件）
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        在提交前，请先确认：
        - [ ] 已在 [路线图](https://github.com/lzg9698-code/nctool-tpl/blob/master/docs/ROADMAP.md) 的待办中搜索
        - [ ] 与[已有 issue 列表](https://github.com/lzg9698-code/nctool-tpl/issues)无重复

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 场景
      description: 想解决什么问题？什么场景下用？举一个具体例子。
      placeholder: |
        例：描述当前工作台中需要重复完成的操作，以及希望怎样减少操作步骤。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 描述你期望的 API / UI / 行为（可附 ASCII mock 或最小示例）
      placeholder: |
        请说明当前动作或页面、建议的新行为和一个可核对的输入/输出例子。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 取舍
      description: 考虑过哪些其他做法？各自的优劣？为什么提案的这个更好？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 仅 CLI 表面
        - 仅 Web UI
        - 引擎 / 资产 / SDK / 运行时 / 插件
        - 配置 / 模板格式
        - 跨多端
    validations:
      required: true

  - type: textarea
    id: break
    attributes:
      label: 是否破坏兼容
      description: 是否会改变退出码 / JSON 响应 / 宿主配置 / JSON 资产格式 / 渲染输出？
        若是，请说明迁移路径
    validations:
      required: false
