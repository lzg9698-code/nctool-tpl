name: Bug 报告
description: 报告 nctool 的缺陷（渲染/校验/CLI/UI/配置）
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先确认

        - [ ] 已用**最新版**（`nctool --version`）复现
        - [ ] 已在本仓库搜索过同类 issue
        - [ ] 若问题与**生成文本内容是否正确**有关，请先自行确认模板与输入数据——
              工具只对渲染、校验、精度与资产写入负责，不代替使用方对输出内容的最终核对。
              内置 NC 能力已移除，本 issue 只用于当前通用模板/参数平台本身的缺陷。

  - type: input
    id: version
    attributes:
      label: nctool 版本
      description: 运行 `nctool --version` 的输出
      placeholder: "nctool 2.2.1"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 问题出在哪个部分
      options:
        - 模板渲染（输出不符合预期）
        - 参数校验（该报错没报 / 误报）
        - CLI 命令/退出码
        - Web UI（`nctool ui`）
        - 共享参数（定义 / 预置 / 绑定）
        - 模板引用与资产（include / 稳定 ID / 指纹）
        - 其他
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现命令
      description: 可复制运行的完整命令（含动作 ID 和输入 JSON）；请一并提供最小输入
      render: bash
      placeholder: |
        nctool --profile template run template.render --input input.json
        # input.json 含 source/template、context 与可选 schema/defaults/extensions
    validations:
      required: true

  - type: textarea
    id: template
    attributes:
      label: 相关模板源码
      description: 若是自定义模板，请贴出最小可复现的模板内容（可用 ```jinja 代码块）
      render: jinja
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期望输出
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 请完整粘贴，含错误行与退出码（PowerShell 使用 `$LASTEXITCODE`）
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 附加日志 / 校验报告
      description: 若有动作的 diagnostics、HTTP 错误响应或浏览器控制台输出，请附上
      render: text
    validations:
      required: false
