[package]
name = "nctool-cli"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
description = "nctool 命令行工具：模板浏览 / 变量提取 / 参数校验 / G-code 生成"
license = "MIT"
repository = "https://github.com/lzg9698-code/nctool-tpl"
keywords = ["gcode", "nc", "cli", "template", "jinja2"]
categories = ["command-line-utilities", "template-engine"]

[dependencies]
nctool-core = { path = "../core", version = "0.2.1" }
nctool-tpl = { path = "..", version = "0.3.2" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# tiny_http：本地 Web UI 服务（阶段 C，ROADMAP Q10 选型——轻量、传递依赖少；
# API 端点超过 8 个再考虑迁移 axum）。仅绑定回环地址，本地开发工具定位
tiny_http = "0.12"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "nctool"
path = "src/main.rs"
