[package]
name = "nctool-cli"
version = "2.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
nctool-runtime={path="../runtime",version="2.0.0"}
nctool-plugin-sdk={path="../sdk",version="2.0.0"}
nctool-plugin-template={path="../plugins/template",version="2.0.0"}
nctool-plugin-math={path="../plugins/math",version="2.0.0",optional=true}
nctool-plugin-nc={path="../plugins/nc",version="2.0.0",optional=true}
nctool-plugin-process={path="../plugins/process",version="2.0.0",optional=true}
clap={version="4",features=["derive"]}
serde_json="1"
serde={version="1",features=["derive"]}
nctool-assets={path="../assets",version="2.0.0"}
axum="0.8"
tokio={version="1",features=["rt-multi-thread","macros","net","signal","sync","time"]}

[features]
default=[]
nc-bundle=["dep:nctool-plugin-math","dep:nctool-plugin-nc","dep:nctool-plugin-process"]

[[bin]]
name="nctool"
path="src/main.rs"
