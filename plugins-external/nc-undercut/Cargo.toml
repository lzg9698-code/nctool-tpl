[package]
name = "nc-undercut"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "NCtool external plugin: ES/FS undercut (overtravel groove) batch generation"

# Deliberately standalone: an external plugin must not depend on the host's
# workspace crates. This keeps the crate buildable from a plain checkout.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
