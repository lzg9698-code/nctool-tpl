[package]
name = "nctool-plugin-nc"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
nctool-plugin-sdk={path="../../sdk",version="2.0.0"}
nctool-tpl={path="../..",version="2.0.0"}
serde_json="1"
serde={version="1",features=["derive"]}
serde_yaml="0.9"
nctool-assets={path="../../assets",version="2.0.0"}
minijinja={version="~2.24.0",features=["unstable_machinery","loop_controls","debug"]}

[dev-dependencies]
nctool-plugin-math={path="../math",version="2.0.0"}
