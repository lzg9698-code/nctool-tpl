[workspace]
members = [".", "assets", "sdk", "runtime", "plugins/template", "plugins/math", "plugins/nc", "plugins/process", "cli"]
default-members = [".", "cli"]
exclude = ["gui"]
resolver = "2"

[package]
name = "nctool-tpl"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
description = "Domain-neutral Jinja parsing, variable analysis and text rendering"
license = "MIT"
repository = "https://github.com/lzg9698-code/nctool-tpl"
include = ["/src/**", "/examples/demo.rs", "/benches/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
minijinja = { version = "~2.24.0", features = ["unstable_machinery", "loop_controls", "debug", "fuel"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1
