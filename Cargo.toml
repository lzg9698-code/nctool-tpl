[workspace]
members = [".", "core", "cli"]
resolver = "2"

[package]
name = "nctool-tpl"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "NCtool 模板解析核心：Jinja2 模板解析 + 变量提取（可选/必选区分）+ 渲染（基于 minijinja）"
license = "MIT"
readme = "README.md"
keywords = ["template", "jinja2", "gcode", "nc", "minijinja"]
categories = ["template-engine", "parser-implementations", "development-tools::build-utils"]
repository = "https://github.com/lzg9698-code/nctool-tpl"
# documentation = "https://docs.rs/nctool-tpl"  # docs.rs 自动生成，无需手动填写

# 发布到 crates.io 时排除的文件（P2-34 / 梳理 U-12，两条开发线合并后的并集）
#
# 根 crate 是**纯库**（nctool-tpl）：`src/` + `benches/` + `examples/` 之外
# 只需要 `templates/turning/demo_gcode.j2` —— `examples/demo.rs` 用
# `CARGO_MANIFEST_DIR` 在**运行时**读该模板，这是本包唯一必须随行的模板资产。
# 其余模板（含 grooving/、undercut 系列、variables.yaml 等）属于 core / CLI
# 的资产或仓库开发用例；`ui/` 由 cli 通过 `include_str!` 打包，均不随本库分发。
#
# 用 `exclude` 而非 `include`：排除法在新增目录时不会误删必需文件
# （踩过一次的教训 —— 漏排是"包变大"，漏 include 是"包坏了"）。
# 改这个列表后用 `cargo package -p nctool-tpl --list` 复核实际收录。
exclude = [
    ".github/",
    ".gitattributes",
    "docs/",
    "target/",
    "*.probestmp",
    # —— 以下为仓库级开发产物，与库的消费方无关 ——
    "output/",              # 原型截图 / 参数样本 / 验收脚本（约 400 KB，本包最大冗余）
    "scripts/",             # CI 与 UI 构建脚本（只在仓库内跑，不随包分发）
    "ui/",                  # Web UI 单文件（cli 通过 include_str! 打包，不在本库）
    "examples/multi_op_demo.sh",
    "templates/README.md",
    "templates/templates.yaml",
    "templates/variables.yaml",
    "templates/grooving/",
    "templates/machines/",  # 机床方案包（CLI 侧配置数据，根 crate 用不到）
    "templates/turning/_undercut_common.j2",
    "templates/turning/undercut.j2",
    "templates/turning/undercut_es.j2",
    "templates/turning/undercut_fs.j2",
    "CODE_REVIEW_AND_DEV_PLAN.md",
    "overview.md",
    "gcm-diagnose.log",
    "lcov.info",
    "启动UI.bat",
]

[dependencies]
# minijinja: 最快、近乎零依赖的 Jinja2 引擎（作者即 Jinja2 原作者）
#   版本约束 ~2.24.0：允许补丁升级（2.24.x），锁定 minor（不允许 2.25+），
#     因为本库依赖 unstable_machinery（不稳定 AST API）和 debug feature，
#     minor 升级可能破坏编译。升级前需跑全量测试验证兼容性。
#   - unstable_machinery: 暴露 AST，用于自建变量提取器（对标 jinja2.meta）
#   - loop_controls: 支持 {% continue %}/{% break %}，补齐 Stmt 枚举变体
#   - debug: 让解析错误的 Error 携带字节范围（range()），用于精确定位列号
minijinja = { version = "~2.24.0", features = ["unstable_machinery", "loop_controls", "debug"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false
